#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "lute"
name = "Lute"
description.en = "Learning Using Texts"
description.fr = "Apprendre à l'aide de textes"

version = "3.10.3~ynh1"

maintainers = [ ]

[upstream]
license = "MIT"
admindoc = "https://luteorg.github.io/lute-manual/install/install.html"
userdoc = "https://luteorg.github.io/lute-manual/"
code = "https://github.com/LuteOrg/lute-v3"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/LuteOrg/lute-v3/archive/refs/tags/3.10.3.tar.gz"
    sha256 = "07930c2f1d6ac40d18bd73ac897cc49c8bc1effdfe0819e56910e06a53dd41b1"
    prefetch = false
    
    # Careful, this asset is not used, it only serves as a notification!
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "python3-dev, python3-venv, python3, python3-pip"
